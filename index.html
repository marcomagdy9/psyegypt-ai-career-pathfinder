
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Psychology Career Pathfinder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-primary': '#002B5B', // Darker Navy
              'brand-secondary': '#00A9FF', // Brighter Blue
              'brand-accent': '#FFD700', // Gold
              'ai-bubble': 'rgba(26, 42, 70, 0.8)', // Semi-transparent
              'user-bubble': '#005f9e',
            },
            fontFamily: {
              sans: ['Cairo', 'sans-serif'],
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #002B5B;
        background-image: radial-gradient(circle at top, #003366, #002B5B 70%);
      }
      /* Custom Scrollbar for a more integrated look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: rgba(0, 156, 222, 0.5);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(0, 156, 222, 0.7);
      }

      @keyframes pulse-logo {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 10px rgba(0, 169, 255, 0.3));
        }
        50% {
          transform: scale(1.03);
          filter: drop-shadow(0 0 20px rgba(0, 169, 255, 0.7));
        }
      }
      .animate-pulse-logo {
        animation: pulse-logo 4s infinite ease-in-out;
      }

      @keyframes slide-in-up {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-slide-in-up {
        animation: slide-in-up 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0"
  }
}
</script>
</head>
  <body class="bg-brand-primary text-gray-100 font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
